<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Suite</title>
    <style>
        :root {
            --bg: #f4efe6;
            --panel: #fffaf2;
            --ink: #2b2a28;
            --accent: #2f7d32;
            --accent-strong: #1f5c23;
            --tab: #dfd4c3;
            --grid: #5b5146;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Trebuchet MS", "Verdana", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background:
                radial-gradient(circle at top, #fff9ef 0%, #f4efe6 48%, #e7dfd1 100%);
            color: var(--ink);
            padding: 24px 16px 40px;
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
        }

        .subtitle {
            margin: 0 0 20px;
            text-align: center;
            max-width: 640px;
        }

        .tabs,
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tabs {
            margin: 8px 0 18px;
        }

        .controls {
            margin-bottom: 20px;
        }

        .tab,
        button {
            border: 0;
            border-radius: 999px;
            padding: 10px 18px;
            cursor: pointer;
            font: inherit;
            transition: transform 120ms ease, background 120ms ease;
        }

        .tab {
            background: var(--tab);
            color: var(--ink);
        }

        .tab.active {
            background: var(--accent);
            color: #fff;
            font-weight: bold;
        }

        button:hover,
        .tab:hover {
            transform: translateY(-1px);
        }

        .solve-btn {
            background: var(--accent);
            color: #fff;
        }

        .solve-btn:hover {
            background: var(--accent-strong);
        }

        .card {
            background: rgba(255, 250, 242, 0.92);
            border: 1px solid rgba(91, 81, 70, 0.18);
            border-radius: 24px;
            box-shadow: 0 14px 36px rgba(64, 53, 39, 0.12);
            padding: 20px;
            max-width: 100%;
        }

        .instructions {
            margin-bottom: 18px;
            border-radius: 16px;
            background: rgba(223, 212, 195, 0.42);
            line-height: 1.45;
            overflow: hidden;
        }

        .instructions summary {
            list-style: none;
            cursor: pointer;
            padding: 14px 16px;
            font-size: 18px;
            font-weight: bold;
        }

        .instructions summary::-webkit-details-marker {
            display: none;
        }

        .instructions summary::after {
            content: "+";
            float: right;
            font-size: 22px;
            line-height: 1;
        }

        .instructions[open] summary::after {
            content: "-";
        }

        .instructions-content {
            padding: 0 16px 14px;
        }

        .instructions p {
            margin: 0 0 8px;
        }

        .instructions ul,
        .instructions ol {
            margin: 0;
            padding-left: 20px;
        }

        .instructions li + li {
            margin-top: 6px;
        }

        .grid {
            display: grid;
            gap: 2px;
            background: var(--grid);
            border: 4px solid var(--grid);
            border-radius: 14px;
            width: fit-content;
            max-width: 100%;
            overflow: auto;
        }

        .cell {
            width: 42px;
            height: 42px;
            background: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            user-select: none;
        }

        .color-1 {
            background: #222 !important;
            color: #fff;
        }

        .color-2,
        .color-3 {
            background: #ff7b7b !important;
            color: #fff;
        }

        .color-4,
        .color-5 {
            background: #fff !important;
            color: #555;
            border: 1px solid #c9c0b4;
        }

        .color-6,
        .color-7 {
            background: #ffe168 !important;
            color: #5c4700;
        }

        .color-8,
        .color-9 {
            background: #7cc7ff !important;
            color: #08324d;
        }

        .status {
            min-height: 56px;
            text-align: center;
            font-weight: bold;
            margin: 16px 0 0;
            padding: 10px 14px;
            border-radius: 14px;
            background: rgba(223, 212, 195, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        .poles-board {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 8px;
            width: 100%;
        }

        .pole-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .pole-button {
            width: 100%;
            border: 2px solid rgba(91, 81, 70, 0.22);
            border-radius: 18px;
            background: rgba(255, 252, 246, 0.9);
            padding: 8px 5px 10px;
            min-width: 0;
        }

        .pole-button.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(47, 125, 50, 0.16);
        }

        .pole-track {
            height: 232px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 3px;
            padding: 6px 4px 0;
        }

        .pole-slot {
            height: 17px;
            border-radius: 999px;
            background: rgba(91, 81, 70, 0.08);
            border: 1px dashed rgba(91, 81, 70, 0.12);
        }

        .sort-block {
            border-style: solid;
            border-width: 1px;
        }

        .sort-red {
            background: #ff7b7b;
            border-color: #cc5e5e;
        }

        .sort-yellow {
            background: #ffe168;
            border-color: #c7a900;
        }

        .sort-blue {
            background: #7cc7ff;
            border-color: #4f97cb;
        }

        .sort-green {
            background: #9bde8b;
            border-color: #6daf5e;
        }

        .sort-purple {
            background: #d0b1ff;
            border-color: #a17dd8;
        }

        .sort-orange {
            background: #ffba66;
            border-color: #d48a2c;
        }

        .pole-base {
            width: 52px;
            height: 8px;
            border-radius: 999px;
            background: #5b5146;
        }

        .pole-label {
            font-size: 12px;
            font-weight: bold;
            color: rgba(43, 42, 40, 0.8);
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
            color: rgba(43, 42, 40, 0.72);
        }

        @media (max-width: 640px) {
            .cell {
                width: 36px;
                height: 36px;
                font-size: 11px;
            }

            .card {
                padding: 14px;
            }
        }
    </style>
</head>
<body>
    <h1>Puzzle Suite</h1>
    <p class="subtitle">Pick a puzzle, tap the black squares, and let the page solve the tiling right in the browser.</p>

    <div class="tabs">
        <button class="tab active" type="button" data-game-id="8x8_classic">8x8 Classic</button>
        <button class="tab" type="button" data-game-id="color_sort_poles">Color Sort Poles</button>
    </div>

    <div class="controls">
        <button type="button" id="generate-btn">Generate Puzzle</button>
        <button class="solve-btn" type="button" id="solve-btn">Solve</button>
        <button type="button" id="reset-btn">Reset</button>
    </div>

    <div class="card">
        <details class="instructions">
            <summary>How to Play</summary>
            <div class="instructions-content" id="instructions-content"></div>
        </details>
        <div id="grid-container"></div>
        <p class="status" id="status"></p>
    </div>

    <footer class="footer">Made with love for puzzle time.</footer>

    <script>
        const games = {
            "8x8_classic": {
                type: "tiling",
                size: 8,
                clicks: 6,
                starterBlocks: [[1, 1], [1, 2], [1, 3]],
                blocks: [[1, 4], [1, 5], [2, 2], [3, 3], [2, 3], [2, 4], [2, 5], [3, 4]],
                instructions: `
                    <p><strong>8x8 Classic</strong> starts by asking the player to create the black area first.</p>
                    <p>You can tap the black squares yourself, or press <strong>Generate Puzzle</strong> to let the game build a random solvable setup for you.</p>
                    <p>For this puzzle, the black area must represent these three starting blocks placed randomly on the board:</p>
                    <ul>
                        <li>one <strong>1x1</strong> block</li>
                        <li>one <strong>1x2</strong> block</li>
                        <li>one <strong>1x3</strong> block</li>
                    </ul>
                    <p>That means the player must tap exactly <strong>6 squares</strong> in total.</p>
                    <p>After that, press <strong>Solve</strong>. The game will try to fill all remaining spaces using exactly these remaining blocks:</p>
                    <ul>
                        <li><strong>1x4</strong> and <strong>1x5</strong></li>
                        <li><strong>2x2</strong>, <strong>2x3</strong>, <strong>2x4</strong>, and <strong>2x5</strong></li>
                        <li><strong>3x3</strong> and <strong>3x4</strong></li>
                    </ul>
                    <p>If the rest of the board can be tiled perfectly with those pieces, the pattern works.</p>
                `
            },
            "color_sort_poles": {
                type: "color-sort",
                poles: 7,
                capacity: 10,
                colors: ["red", "yellow", "green", "blue", "orange"],
                scrambleMoves: 40,
                instructions: `
                    <p><strong>Color Sort Poles</strong> uses 7 poles and 50 sliding blocks.</p>
                    <p>There are <strong>5 colors</strong> with <strong>10 blocks per color</strong>, and each pole can hold at most <strong>10 blocks</strong>.</p>
                    <ul>
                        <li>Click <strong>Generate Puzzle</strong> to create a new randomized setup.</li>
                        <li>When you pick a pole, you must lift <strong>all top blocks of the same color together</strong>.</li>
                        <li>You may place that full color group onto <strong>any pole with enough open space</strong>, regardless of the colors already there.</li>
                        <li>The goal is to gather every color onto its own single pole.</li>
                        <li>Use <strong>Show Solution</strong> to replay one valid solution from the generated start.</li>
                    </ul>
                    <p>The generator only keeps layouts that come from a solvable scramble, so every generated puzzle has a valid solution.</p>
                `
            }
        };

        let currentGame = "8x8_classic";
        let selected = [];
        const sortState = {
            current: null,
            initial: null,
            solutionMoves: [],
            selectedPole: null,
            animating: false
        };

        function createBoard(size) {
            return Array.from({ length: size }, () => Array(size).fill(0));
        }

        function canPlace(board, row, col, width, height, size) {
            if (row + height > size || col + width > size) {
                return false;
            }

            for (let r = row; r < row + height; r += 1) {
                for (let c = col; c < col + width; c += 1) {
                    if (board[r][c] !== 0) {
                        return false;
                    }
                }
            }
            return true;
        }

        function place(board, row, col, width, height, value) {
            for (let r = row; r < row + height; r += 1) {
                for (let c = col; c < col + width; c += 1) {
                    board[r][c] = value;
                }
            }
        }

        function shuffle(list) {
            const copy = [...list];
            for (let i = copy.length - 1; i > 0; i -= 1) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function cloneBoard(board) {
            return board.map((row) => [...row]);
        }

        function sleep(ms) {
            return new Promise((resolve) => {
                window.setTimeout(resolve, ms);
            });
        }

        function blockId(fullList, width, height) {
            return fullList.findIndex(([w, h]) => w === width && h === height) + 2;
        }

        function solve(board, blocksLeft, fullList, size) {
            if (blocksLeft.length === 0) {
                return true;
            }

            for (let row = 0; row < size; row += 1) {
                for (let col = 0; col < size; col += 1) {
                    if (board[row][col] !== 0) {
                        continue;
                    }

                    for (let i = 0; i < blocksLeft.length; i += 1) {
                        const [blockWidth, blockHeight] = blocksLeft[i];
                        const orientations = blockWidth === blockHeight
                            ? [[blockWidth, blockHeight]]
                            : [[blockWidth, blockHeight], [blockHeight, blockWidth]];
                        const originalId = blockId(fullList, blockWidth, blockHeight);

                        for (const [width, height] of orientations) {
                            if (!canPlace(board, row, col, width, height, size)) {
                                continue;
                            }

                            place(board, row, col, width, height, originalId);
                            const remainingBlocks = blocksLeft.slice(0, i).concat(blocksLeft.slice(i + 1));
                            if (solve(board, remainingBlocks, fullList, size)) {
                                return true;
                            }
                            place(board, row, col, width, height, 0);
                        }
                    }

                    return false;
                }
            }

            return true;
        }

        function setStatus(message) {
            document.getElementById("status").textContent = message;
        }

        function updateControls() {
            const game = games[currentGame];
            const generateButton = document.getElementById("generate-btn");
            const solveButton = document.getElementById("solve-btn");
            const resetButton = document.getElementById("reset-btn");

            if (game.type === "tiling") {
                generateButton.textContent = "Generate Puzzle";
                solveButton.textContent = "Solve";
                resetButton.textContent = "Reset";
            } else {
                generateButton.textContent = "Generate Puzzle";
                solveButton.textContent = "Show Solution";
                resetButton.textContent = "Reset Puzzle";
            }
        }

        function renderTilingBoard() {
            const { size, clicks } = games[currentGame];
            const container = document.getElementById("grid-container");
            container.innerHTML = "";
            document.getElementById("instructions-content").innerHTML = games[currentGame].instructions;

            const grid = document.createElement("div");
            grid.className = "grid";
            grid.style.gridTemplateColumns = `repeat(${size}, minmax(36px, 42px))`;

            for (let row = 0; row < size; row += 1) {
                for (let col = 0; col < size; col += 1) {
                    const cell = document.createElement("div");
                    cell.className = "cell";
                    cell.id = `cell-${row}-${col}`;
                    cell.addEventListener("click", () => toggleCell(row, col, cell, clicks));
                    grid.appendChild(cell);
                }
            }

            container.appendChild(grid);
            setStatus(`Select ${clicks} cells.`);
        }

        function resetBoardColors() {
            document.querySelectorAll(".cell").forEach((cell) => {
                cell.className = "cell";
                cell.textContent = "";
            });
        }

        function paintSelectedCells() {
            selected.forEach(([row, col]) => {
                document.getElementById(`cell-${row}-${col}`).classList.add("color-1");
            });
        }

        function initGame() {
            selected = [];
            renderCurrentGame();
        }

        function toggleCell(row, col, element, max) {
            const selectedIndex = selected.findIndex(([r, c]) => r === row && c === col);

            if (selectedIndex > -1) {
                selected.splice(selectedIndex, 1);
                element.classList.remove("color-1");
                return;
            }

            if (selected.length >= max) {
                return;
            }

            selected.push([row, col]);
            element.classList.add("color-1");
        }

        function generatePuzzle() {
            const config = games[currentGame];
            const maxAttempts = 500;

            for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
                const board = createBoard(config.size);
                const generatedCells = [];
                let placedAllStarterBlocks = true;

                for (const [blockWidth, blockHeight] of shuffle(config.starterBlocks)) {
                    const orientations = blockWidth === blockHeight
                        ? [[blockWidth, blockHeight]]
                        : shuffle([[blockWidth, blockHeight], [blockHeight, blockWidth]]);
                    let placed = false;

                    for (const [width, height] of orientations) {
                        const positions = [];
                        for (let row = 0; row <= config.size - height; row += 1) {
                            for (let col = 0; col <= config.size - width; col += 1) {
                                positions.push([row, col]);
                            }
                        }

                        for (const [row, col] of shuffle(positions)) {
                            if (!canPlace(board, row, col, width, height, config.size)) {
                                continue;
                            }

                            place(board, row, col, width, height, 1);
                            for (let r = row; r < row + height; r += 1) {
                                for (let c = col; c < col + width; c += 1) {
                                    generatedCells.push([r, c]);
                                }
                            }
                            placed = true;
                            break;
                        }

                        if (placed) {
                            break;
                        }
                    }

                    if (!placed) {
                        placedAllStarterBlocks = false;
                        break;
                    }
                }

                if (!placedAllStarterBlocks) {
                    continue;
                }

                const testBoard = cloneBoard(board);
                if (!solve(testBoard, config.blocks, config.blocks, config.size)) {
                    continue;
                }

                selected = generatedCells;
                renderTilingBoard();
                paintSelectedCells();
                setStatus("New solvable puzzle generated. Press Solve to reveal the answer.");
                return;
            }

            setStatus("Could not generate a puzzle right now. Try again.");
        }

        function createSolvedSortState(config) {
            const state = [];
            config.colors.forEach((color) => {
                state.push(Array(config.capacity).fill(color));
            });
            while (state.length < config.poles) {
                state.push([]);
            }
            return state;
        }

        function cloneSortState(state) {
            return state.map((pole) => [...pole]);
        }

        function isSortSolved(state) {
            return state.every((pole) => pole.length === 0 || (pole.length === 10 && pole.every((color) => color === pole[0])));
        }

        function getTopColorGroup(state, poleIndex) {
            const pole = state[poleIndex];
            if (!pole.length) {
                return [];
            }

            const topColor = pole[pole.length - 1];
            const group = [];
            for (let index = pole.length - 1; index >= 0; index -= 1) {
                if (pole[index] !== topColor) {
                    break;
                }
                group.unshift(pole[index]);
            }
            return group;
        }

        function getLegalSortMoves(state, capacity) {
            const moves = [];
            for (let from = 0; from < state.length; from += 1) {
                if (state[from].length === 0) {
                    continue;
                }
                const movingGroup = getTopColorGroup(state, from);
                for (let to = 0; to < state.length; to += 1) {
                    if (from === to || state[to].length + movingGroup.length > capacity) {
                        continue;
                    }
                    moves.push({ from, to, color: movingGroup[0], count: movingGroup.length });
                }
            }
            return moves;
        }

        function applySortMove(state, from, to) {
            const movingGroup = getTopColorGroup(state, from);
            for (let count = 0; count < movingGroup.length; count += 1) {
                state[from].pop();
            }
            state[to].push(...movingGroup);
            return movingGroup;
        }

        function getSortStateKey(state) {
            return state.map((pole) => pole.join(",")).join("|");
        }

        function isUniformPole(pole) {
            return pole.length > 0 && pole.every((color) => color === pole[0]);
        }

        function scoreSortMove(state, move, capacity) {
            const destination = state[move.to];
            let score = 0;

            if (destination.length === 0) {
                score += 1;
            }
            if (destination[destination.length - 1] === move.color) {
                score += 5;
            }
            if (isUniformPole(state[move.from]) && state[move.from].length === capacity) {
                score -= 3;
            }
            return score;
        }

        function getPreferredSortMoves(state, capacity, lastMove = null) {
            const emptyTargets = state
                .map((pole, index) => ({ pole, index }))
                .filter(({ pole }) => pole.length === 0)
                .map(({ index }) => index);
            const firstEmptyTarget = emptyTargets.length ? emptyTargets[0] : null;

            return getLegalSortMoves(state, capacity)
                .filter((move) => {
                    if (lastMove && move.from === lastMove.to && move.to === lastMove.from && move.count === lastMove.count && move.color === lastMove.color) {
                        return false;
                    }

                    if (state[move.to].length === 0 && firstEmptyTarget !== null && move.to !== firstEmptyTarget) {
                        return false;
                    }

                    if (isUniformPole(state[move.from]) && state[move.from].length === capacity && state[move.to].length === 0) {
                        return false;
                    }

                    return true;
                })
                .sort((left, right) => scoreSortMove(state, right, capacity) - scoreSortMove(state, left, capacity));
        }

        function findSortSolution(initialState, config, maxDepth = 8) {
            for (let depthLimit = 1; depthLimit <= maxDepth; depthLimit += 1) {
                const seen = new Map();
                const solution = searchSortSolution(initialState, config.capacity, depthLimit, seen, null);
                if (solution) {
                    return solution;
                }
            }
            return null;
        }

        function searchSortSolution(state, capacity, depthRemaining, seen, lastMove) {
            if (isSortSolved(state)) {
                return [];
            }

            if (depthRemaining === 0) {
                return null;
            }

            const stateKey = getSortStateKey(state);
            const bestSeen = seen.get(stateKey);
            if (bestSeen !== undefined && bestSeen >= depthRemaining) {
                return null;
            }
            seen.set(stateKey, depthRemaining);

            const moves = getPreferredSortMoves(state, capacity, lastMove);
            for (const move of moves) {
                const nextState = cloneSortState(state);
                applySortMove(nextState, move.from, move.to);
                const suffix = searchSortSolution(nextState, capacity, depthRemaining - 1, seen, move);
                if (suffix) {
                    return [move, ...suffix];
                }
            }

            return null;
        }

        function createRandomSortCandidate(config) {
            const state = createSolvedSortState(config);
            const colorPoleIndexes = shuffle([0, 1, 2, 3, 4]);
            const firstPole = colorPoleIndexes[0];
            const secondPole = colorPoleIndexes[1];
            const firstColor = state[firstPole][0];
            const secondColor = state[secondPole][0];
            const firstSwapCount = 1 + Math.floor(Math.random() * 3);
            const secondSwapCount = 1 + Math.floor(Math.random() * 3);

            state[firstPole] = [
                ...Array(config.capacity - firstSwapCount).fill(firstColor),
                ...Array(firstSwapCount).fill(secondColor)
            ];
            state[secondPole] = [
                ...Array(config.capacity - secondSwapCount).fill(secondColor),
                ...Array(secondSwapCount).fill(firstColor)
            ];

            return shuffle(state.map((pole) => [...pole]));
        }

        function renderSortGame() {
            const config = games[currentGame];
            const container = document.getElementById("grid-container");
            container.innerHTML = "";
            document.getElementById("instructions-content").innerHTML = config.instructions;

            const board = document.createElement("div");
            board.className = "poles-board";

            if (!sortState.current) {
                container.appendChild(board);
                setStatus("Press Generate Puzzle to create a new pole-sorting game.");
                return;
            }

            sortState.current.forEach((pole, poleIndex) => {
                const card = document.createElement("div");
                card.className = "pole-card";

                const button = document.createElement("button");
                button.type = "button";
                button.className = "pole-button";
                if (sortState.selectedPole === poleIndex) {
                    button.classList.add("selected");
                }
                button.addEventListener("click", () => handleSortPoleClick(poleIndex));

                const track = document.createElement("div");
                track.className = "pole-track";

                for (let slot = config.capacity - 1; slot >= 0; slot -= 1) {
                    const slotElement = document.createElement("div");
                    slotElement.className = "pole-slot";
                    if (slot < pole.length) {
                        slotElement.classList.add("sort-block", `sort-${pole[slot]}`);
                    }
                    track.appendChild(slotElement);
                }

                const base = document.createElement("div");
                base.className = "pole-base";

                const label = document.createElement("div");
                label.className = "pole-label";
                label.textContent = `Pole ${poleIndex + 1}`;

                button.appendChild(track);
                card.appendChild(button);
                card.appendChild(base);
                card.appendChild(label);
                board.appendChild(card);
            });

            container.appendChild(board);
        }

        function renderCurrentGame() {
            updateControls();
            if (games[currentGame].type === "tiling") {
                renderTilingBoard();
            } else {
                renderSortGame();
            }
        }

        function generateSortPuzzle() {
            const config = games[currentGame];
            const maxAttempts = 120;

            for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
                const candidate = createRandomSortCandidate(config);
                const solution = findSortSolution(candidate, config, 8);
                if (!solution) {
                    continue;
                }

                sortState.initial = cloneSortState(candidate);
                sortState.current = cloneSortState(candidate);
                sortState.selectedPole = null;
                sortState.animating = false;
                sortState.solutionMoves = solution;

                renderSortGame();
                setStatus("New solvable pole puzzle generated. Sort each color onto its own pole.");
                return;
            }

            setStatus("Could not generate a new pole puzzle right now. Try again.");
        }

        function resetSortPuzzle() {
            if (!sortState.initial) {
                setStatus("Press Generate Puzzle to create a new pole-sorting game.");
                return;
            }

            sortState.current = cloneSortState(sortState.initial);
            sortState.selectedPole = null;
            sortState.animating = false;
            renderSortGame();
            setStatus("Puzzle reset to the generated start.");
        }

        function handleSortPoleClick(poleIndex) {
            if (games[currentGame].type !== "color-sort" || !sortState.current || sortState.animating) {
                return;
            }

            const config = games[currentGame];
            const currentPole = sortState.current[poleIndex];

            if (sortState.selectedPole === null) {
                if (currentPole.length === 0) {
                    setStatus("That pole is empty. Pick a pole with a block on top.");
                    return;
                }

                const movingGroup = getTopColorGroup(sortState.current, poleIndex);
                sortState.selectedPole = poleIndex;
                renderSortGame();
                setStatus(`Pole ${poleIndex + 1} selected with ${movingGroup.length} ${movingGroup[0]} block${movingGroup.length === 1 ? "" : "s"} on top. Choose another pole with enough room.`);
                return;
            }

            if (sortState.selectedPole === poleIndex) {
                sortState.selectedPole = null;
                renderSortGame();
                setStatus("Selection cleared.");
                return;
            }

            const from = sortState.selectedPole;
            const to = poleIndex;
            const movingGroup = getTopColorGroup(sortState.current, from);

            if (sortState.current[to].length + movingGroup.length > config.capacity) {
                setStatus(`Pole ${to + 1} does not have enough room for ${movingGroup.length} block${movingGroup.length === 1 ? "" : "s"}.`);
                return;
            }

            applySortMove(sortState.current, from, to);
            sortState.selectedPole = null;
            renderSortGame();

            if (isSortSolved(sortState.current)) {
                setStatus("Solved! Each color is grouped on its own pole.");
            } else {
                setStatus(`Moved ${movingGroup.length} ${movingGroup[0]} block${movingGroup.length === 1 ? "" : "s"} from Pole ${from + 1} to Pole ${to + 1}.`);
            }
        }

        async function showSortSolution() {
            if (!sortState.initial || !sortState.solutionMoves.length) {
                setStatus("Generate a pole puzzle first.");
                return;
            }

            sortState.current = cloneSortState(sortState.initial);
            sortState.selectedPole = null;
            sortState.animating = true;
            renderSortGame();

            for (let step = 0; step < sortState.solutionMoves.length; step += 1) {
                const move = sortState.solutionMoves[step];
                setStatus(`Solution step ${step + 1} of ${sortState.solutionMoves.length}: move ${move.count} ${move.color} block${move.count === 1 ? "" : "s"} from Pole ${move.from + 1} to Pole ${move.to + 1}.`);
                await sleep(450);
                if (games[currentGame].type !== "color-sort") {
                    sortState.animating = false;
                    return;
                }
                applySortMove(sortState.current, move.from, move.to);
                renderSortGame();
            }

            sortState.animating = false;
            setStatus("Solution complete.");
        }

        function paintSolution(board) {
            board.forEach((row, rowIndex) => {
                row.forEach((value, colIndex) => {
                    const cell = document.getElementById(`cell-${rowIndex}-${colIndex}`);
                    cell.className = `cell color-${value}`;
                    cell.textContent = value > 1 ? value - 1 : "";
                });
            });
        }

        function runSolver() {
            const config = games[currentGame];
            if (selected.length !== config.clicks) {
                setStatus(`Select ${config.clicks} cells.`);
                return;
            }

            resetBoardColors();
            paintSelectedCells();

            const board = createBoard(config.size);
            selected.forEach(([row, col]) => {
                board[row][col] = 1;
            });

            const solved = solve(board, config.blocks, config.blocks, config.size);
            if (solved) {
                paintSolution(board);
                setStatus("Solved!");
            } else {
                setStatus("No solution found.");
            }
        }

        document.querySelectorAll(".tab").forEach((button) => {
            button.addEventListener("click", () => {
                currentGame = button.dataset.gameId;
                document.querySelectorAll(".tab").forEach((tab) => tab.classList.remove("active"));
                button.classList.add("active");
                if (games[currentGame].type === "tiling") {
                    initGame();
                } else {
                    renderCurrentGame();
                }
            });
        });

        document.getElementById("generate-btn").addEventListener("click", () => {
            if (games[currentGame].type === "tiling") {
                generatePuzzle();
            } else {
                generateSortPuzzle();
            }
        });
        document.getElementById("solve-btn").addEventListener("click", () => {
            if (games[currentGame].type === "tiling") {
                runSolver();
            } else {
                showSortSolution();
            }
        });
        document.getElementById("reset-btn").addEventListener("click", () => {
            if (games[currentGame].type === "tiling") {
                initGame();
            } else {
                resetSortPuzzle();
            }
        });

        initGame();
    </script>
</body>
</html>
